<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e232d" />
      <stop offset="100%" stop-color="#0c0e13" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cca0" />
      <stop offset="50%" stop-color="#c8a86b" />
      <stop offset="100%" stop-color="#917238" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c8452b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#c8a86b" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Brass Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#brassGrad)" stroke-width="8" stroke-dasharray="14 8" opacity="0.6" />

  <!-- Speed Racing Arc -->
  <path d="M 96,310 A 185,185 0 0,1 420,220" fill="none" stroke="url(#crimsonGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Dark Core -->
  <circle cx="256" cy="256" r="148" fill="#13161d" stroke="#222834" stroke-width="3" />

  <!-- Car Silhouette & Speed lines -->
  <path d="M 180,240 C 200,215 220,205 256,205 C 292,205 312,215 332,240 L 350,250 C 358,255 358,265 350,268 L 162,268 C 154,265 154,255 162,250 Z" fill="url(#brassGrad)" opacity="0.25" />

  <!-- Monogram "Z" Symbol -->
  <text x="256" y="295" font-family="'Sora', 'Inter', -apple-system, sans-serif" font-size="148" font-weight="900" fill="url(#brassGrad)" text-anchor="middle" filter="url(#glow)">Z</text>

  <!-- ZZZ GARAGE Badge Text -->
  <rect x="156" y="342" width="200" height="30" rx="15" fill="#c8452b" />
  <text x="256" y="362" font-family="'Sora', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="2.5" fill="#ffffff" text-anchor="middle">ZZZ GARAGE</text>
</svg>
